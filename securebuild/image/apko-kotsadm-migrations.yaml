contents:
  repositories:
    - https://apk.cve0.io
  keyring:
    - https://apk.cve0.io/key/cve0-signing.rsa.pub
  packages:
    - kotsadm-migrations
    - bash
    - busybox
    - securebuild-baselayout
    - curl
    - git
    - ca-certificates-bundle
    # schemahero 0.23+ ships the rqlite driver as a separate go-plugin, not in the CLI.
    # Installed to /var/lib/schemahero/plugins at build time (airgap-safe); pinned to go.mod.
    - schemahero-0.25-rqlite~0.25.1

paths:
  - path: /schemahero
    type: symlink
    source: /usr/local/bin/schemahero
    permissions: 0o755

accounts:
  groups:
    - groupname: schemahero
      gid: 1001
  users:
    - username: schemahero
      uid: 1001
      gid: 1001
  run-as: schemahero

entrypoint:
  command: /schemahero

cmd: apply