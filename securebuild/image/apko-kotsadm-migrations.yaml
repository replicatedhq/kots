contents:
  repositories:
    - https://apk.cve0.io
  keyring:
    - https://apk.cve0.io/key/cve0-signing.rsa.pub
  packages:
    - kotsadm-migrations
    - schemahero-rqlite~0.26.1
    - bash
    - busybox
    - securebuild-baselayout
    - curl
    - git
    - ca-certificates-bundle

# Point schemahero at the bundled plugin so discovery never falls back to a
# network download. Redundant with the default search paths, but explicit.
environment:
  SCHEMAHERO_PLUGIN_PATH: /var/lib/schemahero/plugins

paths:
  - path: /schemahero
    type: symlink
    source: /usr/local/bin/schemahero
    permissions: 0o755

accounts:
  groups:
    - groupname: schemahero
      gid: 1001
  users:
    - username: schemahero
      uid: 1001
      gid: 1001
  run-as: schemahero

entrypoint:
  command: /schemahero

cmd: apply
