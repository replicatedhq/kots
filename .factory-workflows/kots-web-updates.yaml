schema_version: v1
name: kots-web-updates
enabled: true

trigger:
  cron:
    schedule: "0 0 * * *"
    timezone: "America/Chicago"
    overlap_policy: skip
    timeout: 2h

enable_manual_trigger: true

tags: ["cron", "dependencies"]
color: cyan

stages:
  - id: start
    label: Start
    entry: true
    on_enter:
      inject: |
        Workflow task: run the JavaScript dependency update maintenance workflow for KOTS.

        This is an unattended dependency maintenance workflow. Do not ask for
        permission to start. First, prepare the target branch:

        - Check for an open PR with title "[deps] Dependency update: web" or branch "deps/dependency-update-web".
        - If an open PR exists, fetch its branch, rebase it onto the current base branch, and check it out.
        - If no open PR exists, create and check out a new branch named "deps/dependency-update-web".

        Then say exactly [PROCEED] so the workflow can run the dependency
        updater on the prepared branch.

  - id: working
    label: Working
    triggers:
      - message_contains: "[PROCEED]"
    on_enter:
      run:
        command: |
          bash -lc '
            set -euo pipefail

            ( cd kots/web && yarn upgrade )

            python3 scripts/web_collect_changes.py kots/web
          '
        output: dependency_updates
        timeout: 30m
      inject: |
        Dependency updates were applied on the current branch.

        Scope this workflow strictly to the web package dependencies.
        Focus only on web/package.json and web/yarn.lock. Do not update
        Go modules, registry-v2, vendor-web, enterprise-portal, admin, or any
        top-level dependency files outside web.

        Treat compatibility fixes as part of this workflow. If an updated
        dependency causes build, lint, type, or test failures, first attempt
        reasonable scoped code changes within web to support the new
        version. Do not downgrade, pin, or skip an update just because it has
        breaking API changes unless the required changes are broad, risky,
        unrelated to this workflow's scope, or cannot be completed within
        reasonable effort. If you defer an update, explain exactly why.

        Review {{ .Outputs.dependency_updates.files_changed }}.
        Before opening a PR, validate using the web Makefile targets. Do not run
        ad-hoc package manager commands; use exactly these targets:

        - cd kots/web && make deps
        - cd kots/web && make lint
        - cd kots/web && make test-unit
        - cd kots/web && make build-local

        After the PR is open, the workflow will wait for GitHub CI checks to
        finish, retry any failed GitHub Actions jobs once, and surface the logs
        if they still fail. You must then fix the failures and say [DONE] again.

        Fix any failures and open one grouped PR with the following
        requirements:

        - Branch name: deps/dependency-update-web
        - PR title: [deps] Dependency update: web
        - PR body must start with: "This PR was generated by the dependency-update-web Factory workflow."
        - Before creating a new branch/PR, check for an open PR from this
          workflow. If an open PR exists, fetch and check out its branch,
          rebase it onto the current base branch, apply the dependency updates,
          push the changes, and update the existing PR. If a branch exists but
          has no open PR, delete it and create a fresh branch/PR.
        Say [DONE] with the PR URL only when the PR is open and the local checks
        above pass, so the workflow can monitor the GitHub CI results.
        If {{ .Outputs.dependency_updates.files_changed }} is empty and no PR is
        needed, say [NO_CHANGES] instead of [DONE].

  - id: no-changes
    label: No Changes
    triggers:
      - message_contains: "[NO_CHANGES]"
      - message_contains: "[DONE] No changes"
    terminal: true

  - id: validate
    label: Validate
    triggers:
      - message_contains: "[DONE]"
    on_enter:
      run:
        command: |
          bash -lc '
            set +e
            tmpdir="$(mktemp -d)"

            ( cd kots/web && make deps >"$tmpdir/deps.log" 2>&1 ); deps_status=$?
            ( cd kots/web && make lint >"$tmpdir/lint.log" 2>&1 ); lint_status=$?
            ( cd kots/web && make test-unit >"$tmpdir/unit_tests.log" 2>&1 ); unit_tests_status=$?
            ( cd kots/web && make build-local >"$tmpdir/build.log" 2>&1 ); build_status=$?

            python3 scripts/summarize_local_checks.py "$tmpdir" deps "$deps_status" lint "$lint_status" unit_tests "$unit_tests_status" build "$build_status"
          '
        output: validation
        timeout: 45m
    gate:
      output: validation
      pass:
        path: status
        values: [passed]
      fail:
        path: status
        values: [failed, error]
      required: true

  - id: fix-validation
    label: Fix Validation
    triggers:
      - gate_result:
          stage: validate
          verdict: fail
    on_enter:
      inject: |
        Validation failed before completion.

        Status: {{ .Outputs.validation.status }}
        Reason: {{ .Outputs.validation.reason }}

        Checks:
        {{ .Outputs.validation.checks }}

        Fix the failures above, commit the changes to the same PR branch, and
        say [DONE] with the PR URL again when the PR is ready for validation.

  - id: wait-for-ci
    label: Wait for CI
    triggers:
      - gate_result:
          stage: validate
          verdict: pass
    on_enter:
      run:
        command: |
          bash -lc '
            set -euo pipefail

            if ! command -v gh >/dev/null 2>&1; then
                echo "{\"status\": \"error\", \"reason\": \"gh CLI is not available\"}"
                exit 1
            fi

            if ! gh auth status >/dev/null 2>&1; then
                echo "{\"status\": \"error\", \"reason\": \"gh CLI is not authenticated\"}"
                exit 1
            fi

            python3 scripts/wait_for_pr_ci.py --repo-dir kots --branch deps/dependency-update-web
          '
        output: ci_status
        timeout: 120m
    gate:
      output: ci_status
      pass:
        path: status
        values: [passed]
      fail:
        path: status
        values: [failed, error]
      required: true

  - id: fix-ci
    label: Fix CI Failures
    triggers:
      - gate_result:
          stage: wait-for-ci
          verdict: fail
    on_enter:
      inject: |
        GitHub CI checks failed and the automatic retry did not resolve them.

        PR: {{ .Outputs.ci_status.pr_url }}
        Status: {{ .Outputs.ci_status.status }}
        Failed checks:
        {{ .Outputs.ci_status.checks }}

        Retried GitHub Actions runs:
        {{ .Outputs.ci_status.retried }}

        Log tails from the retried failed jobs:
        {{ .Outputs.ci_status.logs }}

        Read the logs, identify the root cause of the failures, and make
        reasonable scoped fixes in the PR branch (under kots/web when the issue
        is in the web code). Commit and push the fixes to the same branch.

        If the failures are clearly unrelated to the dependency update (for
        example, an infrastructure or flaky CI issue that you cannot resolve
        from the code), or if you have tried to fix them and the failures persist,
        explain why and say exactly [CI FAILED] to stop the workflow instead of
        looping indefinitely.

        When the fixes are pushed and the PR is ready, say [DONE] with the PR
        URL again so the workflow re-runs the local validation and monitors CI.

  - id: ci-failed
    label: CI Failed
    triggers:
      - message_contains: "[CI FAILED]"
    terminal: true

  - id: complete
    label: Complete
    triggers:
      - gate_result:
          stage: wait-for-ci
          verdict: pass
    terminal: true
