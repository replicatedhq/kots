name: regression

on:
  workflow_call:
    inputs:
      version_tag_old:
        description: 'The initial install version to use for upgrade scenarios'
        required: true
        type: string
      version_tag_new:
        description: 'The new version to use as the upgrade in upgrade scenarios and the initial version for fresh installs.'
        required: true
        type: string
      addon_package_url:
        description: 'The URL to the kURL add-on package to use as an override.'
        required: false
        type: string
      id:
        description: 'An arbitrary value used to identify the testing infrastructure. Using the same value twice will destroy the old infrastructure before creating.'
        required: false
        type: string
    secrets:
      TESTIM_ACCESS_TOKEN:
        required: true
      E2E_TESTIM_AWS_ACCESS_KEY_ID:
        required: true
      E2E_TESTIM_AWS_SECRET_ACCESS_KEY:
        required: true
      REPLICATED_QA_API_TOKEN:
        required: true
      IDENTITY_SERVICE_OKTA_PASSWORD:
        required: true
      IDENTITY_SERVICE_OKTA_CLIENT_SECRET:
        required: true
      IDENTITY_SERVICE_OKTA_ACCESS_TOKEN:
        required: true
      E2E_GH_PAT:
        required: true
      KOTS_BUILD_STATUS_SLACK_WEBHOOK_URL:
        required: true
      REPLICATED_API_TOKEN:
        required: true

  workflow_dispatch:
    inputs:
      version_tag_old:
        description: 'The initial install version to use for upgrade scenarios'
        required: true
        type: string
      version_tag_new:
        description: 'The new version to use as the upgrade in upgrade scenarios and the initial version for fresh installs.'
        required: true
        type: string
      addon_package_url:
        description: 'The URL to the kURL add-on package to use as an override.'
        required: false
        type: string
      id:
        description: 'An arbitrary value used to identify the testing infrastructure. Using the same value twice will destroy the old infrastructure before creating.'
        required: false
        type: string

env:
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: ${{ secrets.E2E_TESTIM_AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_TESTIM_AWS_SECRET_ACCESS_KEY }}
  TF_VAR_replicated_api_token: ${{ secrets.REPLICATED_QA_API_TOKEN }}
  TF_VAR_aws_access_key_id: ${{ secrets.E2E_TESTIM_AWS_ACCESS_KEY_ID }}
  TF_VAR_aws_secret_access_key: ${{ secrets.E2E_TESTIM_AWS_SECRET_ACCESS_KEY }}
  TF_VAR_identity_service_okta_password: ${{ secrets.IDENTITY_SERVICE_OKTA_PASSWORD }}
  TF_VAR_identity_service_okta_client_secret: ${{ secrets.IDENTITY_SERVICE_OKTA_CLIENT_SECRET }}
  TF_VAR_identity_service_okta_access_token: ${{ secrets.IDENTITY_SERVICE_OKTA_ACCESS_TOKEN }}
  TF_VAR_testim_token: ${{ secrets.TESTIM_ACCESS_TOKEN }}

jobs:
  get-workspace-name:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.workspace.outputs.name }}
    env:
      WORKSPACE_PREFIX: automation-${{ github.event.inputs.id || inputs.id }}
    steps:
    - name: Set the workspace name as output
      id: workspace
      run: |
        CURRENT_TIMESTAMP=$(date +%s)
        echo "name=${{ env.WORKSPACE_PREFIX }}-${CURRENT_TIMESTAMP}" >> "$GITHUB_OUTPUT"

  get-workspace-expiration:
    runs-on: ubuntu-latest
    outputs:
      expiration: ${{ steps.workspace.outputs.expiration }}
    steps:
    - name: Set the workspace expiration as output
      id: workspace
      run: |
        echo "expiration=$(date -d '+2 days' '+%Y-%m-%d')" >> "$GITHUB_OUTPUT"

  jumpbox:
    needs: [get-workspace-name, get-workspace-expiration]
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.14.9
    env:
      WORKSPACE: ${{ needs.get-workspace-name.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: replicatedhq/kots-regression-automation
          token: ${{ secrets.E2E_GH_PAT }}
          path: automation
          ref: main

      - name: Download kots binary
        uses: actions/download-artifact@v8
        with:
          name: kots
          path: ./automation/jumpbox/bin

      - name: Download kotsadm bundle
        uses: actions/download-artifact@v8
        with:
          name: kotsadm-bundle
          path: ./automation/jumpbox/kotsadm-bundle

      - name: Make kotsadm airgap archive
        working-directory: automation/jumpbox/kotsadm-bundle
        run: tar -czf ../kotsadm.tar.gz -- *

      - name: Initialize terraform
        if: always()
        working-directory: automation/jumpbox
        run: |
          terraform init
          terraform workspace new "$WORKSPACE" || true
          terraform workspace select "$WORKSPACE"

      - name: Create Jumpbox Environment
        if: always()
        working-directory: automation/jumpbox
        run: |
          export TF_VAR_expires_on="${{ needs.get-workspace-expiration.outputs.expiration }}"
          export TF_VAR_kots_branch="${{ github.ref_name }}"
          terraform apply --auto-approve

      - name: Notify Slack
        if: failure() && github.ref_name == 'main'
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,ref,workflow
          custom_payload: |
            {
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : '${{ job.status }}' === 'failure' ? 'danger' : 'warning',
                text: `Create jumpbox: ${{ job.status }}. Workflow: ${process.env.AS_WORKFLOW}. Repo: ${process.env.AS_REPO}.\nRef: ${process.env.AS_REF}`,
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.KOTS_BUILD_STATUS_SLACK_WEBHOOK_URL }}

  tests:
    needs: [get-workspace-name, get-workspace-expiration, jumpbox]
    runs-on: ubuntu-latest
    container:
      image: hashicorp/terraform:1.14.9
    env:
      WORKSPACE: ${{ needs.get-workspace-name.outputs.name }}
    strategy:
      fail-fast: false
      matrix:
        test: [
          # NOTE (@salah): decided not to port this test to playwright
          # {
          #   id: "embedded-airgapped-upgrade",
          #   name: "type=embedded cluster, env=airgapped, phase=upgraded install, rbac=cluster admin",
          #   backend_config: "embedded-airgapped-upgrade-backend-config.tfvars",
          #   terraform_script: "embedded-airgapped-upgrade.sh",
          #   is_upgrade: "1"
          # },
          # NOTE (@banjoh): we need to fix this test as part of a separate story
          # https://app.shortcut.com/replicated/story/136040/kots-regression-test-for-kurl-airgap-install-failing-due-to-libpython-lib-package-version-mismatch
          # {
          #   id: "embedded-airgapped-install",
          #   name: "type=embedded cluster, env=airgapped, phase=new install, rbac=cluster admin",
          #   backend_config: "embedded-airgapped-install-backend-config.tfvars",
          #   terraform_script: "embedded-airgapped-install.sh",
          #   is_upgrade: "0"
          # },
          {
            id: "embedded-online-install",
            name: "type=embedded cluster, env=online, phase=new install, rbac=cluster admin",
            backend_config: "embedded-online-install-backend-config.tfvars",
            terraform_script: "embedded-online-install.sh",
            is_upgrade: "0"
          }
          # NOTE (@salah): decided not to port this test to playwright
          # {
          #   id: "embedded-online-upgrade",
          #   name: "type=embedded cluster, env=online, phase=upgraded install, rbac=cluster admin",
          #   backend_config: "embedded-online-upgrade-backend-config.tfvars",
          #   terraform_script: "embedded-online-upgrade.sh",
          #   is_upgrade: "1"
          # },
          # NOTE (@salah): decided not to port this test to playwright
          # {
          #   id: "helmvm-online-install",
          #   name: "type=helmvm cluster, env=online, phase=new install, rbac=cluster admin",
          #   backend_config: "helmvm-online-install-backend-config.tfvars",
          #   terraform_script: "helmvm-online-install.sh",
          #   is_upgrade: "0"
          # }
        ]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          repository: replicatedhq/kots-regression-automation
          token: ${{ secrets.E2E_GH_PAT }}
          path: automation
          ref: main

      - name: Initialize terraform
        if: always()
        working-directory: automation/cluster
        run: |
          terraform init -backend-config ${{ matrix.test.backend_config }}
          terraform workspace new "$WORKSPACE" || true
          terraform workspace select "$WORKSPACE"

      - name: Destroy test environment before re-run
        if: always() && github.run_attempt > 1
        working-directory: automation/cluster
        run: ./${{ matrix.test.terraform_script }} destroy

      - name: Create test environment
        if: always()
        working-directory: automation/cluster
        run: |
          export CURRENT_TAG="${{ github.event.inputs.version_tag_old || inputs.version_tag_old }}"
          export NEXT_TAG="${{ github.event.inputs.version_tag_new || inputs.version_tag_new }}"

          if [ "${{ matrix.test.is_upgrade }}" == "1" ]; then
            export TF_VAR_kots_version_initial="${CURRENT_TAG:1}"
            export TF_VAR_kots_version_upgrade="${NEXT_TAG:1}"
          else
            export TF_VAR_kots_version_initial="${NEXT_TAG:1}"
          fi
          export TF_VAR_kots_addon_package_url="${{ github.event.inputs.addon_package_url || inputs.addon_package_url }}"
          export TF_VAR_testim_branch="master"
          export TF_VAR_expires_on="${{ needs.get-workspace-expiration.outputs.expiration }}"
          ./${{ matrix.test.terraform_script }} apply

      - name: Wait for instance to be ready
        working-directory: automation/cluster
        run: |
          apk update && apk add aws-cli jq
          terraform output -raw control_plane_instance_id
          until [ -n "$(aws ec2 describe-instance-status --instance-ids "$(terraform output -raw control_plane_instance_id)" --filter Name=instance-status.reachability,Values=passed | jq -r '.InstanceStatuses[].InstanceStatus.Details[].Status')" ]
          do
          echo "waiting for instance to become ready" && sleep 1
          done

      - name: Run the test
        working-directory: automation/cluster
        run: |
          terraform output -raw jumpbox_private_key > ssh.pem
          chmod 600 ssh.pem
          ssh -i ssh.pem "ubuntu@$(terraform output -raw jumpbox_public_ip)" -oStrictHostKeyChecking=no -oServerAliveInterval=60 -oServerAliveCountMax=10 "ssh -tt ubuntu@$(terraform output -raw control_plane_private_ip) -oServerAliveInterval=60 -oServerAliveCountMax=10 -oConnectionAttempts=30 \"sudo /tmp/start.sh\""

      - name: Copy playwright report from remote machine
        if: failure()
        working-directory: automation/cluster
        run: |
          jumpbox_public_ip=$(terraform output -raw jumpbox_public_ip)
          control_plane_private_ip=$(terraform output -raw control_plane_private_ip)

          # Create tarball of playwright report on control plane
          ssh -i ssh.pem "ubuntu@$jumpbox_public_ip" \
              "ssh -t ubuntu@$control_plane_private_ip \
              'cd /home/ubuntu/playwright && tar -czf /home/ubuntu/playwright-report.tar.gz playwright-report'"

          # Copy tarball from control plane to jumpbox
          ssh -i ssh.pem "ubuntu@$jumpbox_public_ip" \
              "scp ubuntu@$control_plane_private_ip:/home/ubuntu/playwright-report.tar.gz /home/ubuntu/${{ matrix.test.id }}-playwright-report.tar.gz"

          # Copy tarball from jumpbox to local machine
          scp -i ssh.pem "ubuntu@$jumpbox_public_ip:/home/ubuntu/${{ matrix.test.id }}-playwright-report.tar.gz" ./playwright-report.tar.gz

          # Extract tarball
          tar -xzf ./playwright-report.tar.gz

      - name: Upload playwright report
        id: upload-playwright-report
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ github.job }}-${{ matrix.test.name }}-playwright-report
          path: ./automation/cluster/playwright-report/

      - name: Copy support bundles from remote machine
        if: failure()
        working-directory: automation/cluster
        run: |
          jumpbox_public_ip=$(terraform output -raw jumpbox_public_ip)
          control_plane_private_ip=$(terraform output -raw control_plane_private_ip)

          for bundle in host-support-bundle in-cluster-support-bundle; do
            # Copy tarball from control plane to jumpbox
            ssh -i ssh.pem "ubuntu@$jumpbox_public_ip" \
                "scp ubuntu@$control_plane_private_ip:/tmp/${bundle}.tar.gz /home/ubuntu/${{ matrix.test.id }}-${bundle}.tar.gz 2>/dev/null || true"

            # Copy tarball from jumpbox to local machine
            scp -i ssh.pem "ubuntu@$jumpbox_public_ip:/home/ubuntu/${{ matrix.test.id }}-${bundle}.tar.gz" ./${bundle}.tar.gz 2>/dev/null || true
          done

      - name: Upload support bundles
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ${{ github.job }}-${{ matrix.test.name }}-support-bundles
          path: |
            ./automation/cluster/host-support-bundle.tar.gz
            ./automation/cluster/in-cluster-support-bundle.tar.gz

      - name: Troubleshoot Playwright
        if: ${{ failure() && steps.upload-playwright-report.outputs.artifact-url != '' }}
        run: |
          echo -e "\e[1;33m┌──────────────────────────────────────────────────────────────────────────────────────────────────────┐\e[0m"
          echo -e "\e[1;33m                                  To view the Playwright test report:                                   \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   1- Download & extract the report from:                                                               \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;34m      ${{ steps.upload-playwright-report.outputs.artifact-url }}                                        \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   2- From inside the extracted directory, run:                                                         \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;32m      npx playwright show-report .                                                                      \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m└──────────────────────────────────────────────────────────────────────────────────────────────────────┘\e[0m"

      - name: Troubleshoot Admin Console
        if: failure()
        working-directory: automation/cluster
        run: |
          echo -e "\e[1;33m┌──────────────────────────────────────────────────────────────────────────────────────────────────────┐\e[0m"
          echo -e "\e[1;33m                                  You can access the admin console at:                                  \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;34m      $(terraform output -raw test_endpoint)                                                            \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m└──────────────────────────────────────────────────────────────────────────────────────────────────────┘\e[0m"

      - name: Troubleshoot Test Instance
        if: failure()
        working-directory: automation/cluster
        run: |
          echo -e "\e[1;33m┌──────────────────────────────────────────────────────────────────────────────────────────────────────┐\e[0m"
          echo -e "\e[1;33m                                  To connect to the test instance:                                      \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   1- Install Terraform CLI:                                                                            \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;34m      https://developer.hashicorp.com/terraform/tutorials/aws-get-started/install-cli                   \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   2- Clone the kots-regression-automation repo:                                                        \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;32m      git clone git@github.com:replicatedhq/kots-regression-automation.git                              \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   3- Navigate to jumpbox directory:                                                                    \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;32m      cd kots-regression-automation/jumpbox                                                             \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   4- Set Terraform workspace:                                                                          \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;32m      export TF_WORKSPACE=$WORKSPACE                                                                    \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   5- Connect to jumpbox:                                                                               \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;32m      ./utils/jumpbox-connect.sh                                                                        \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m   6- Connect to test instance:                                                                         \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;32m      ssh $(terraform output -raw control_plane_private_ip)                                             \e[0m"
          echo -e "\e[1;33m                                                                                                        \e[0m"
          echo -e "\e[1;33m└──────────────────────────────────────────────────────────────────────────────────────────────────────┘\e[0m"

      - name: Notify Slack
        if: always() && github.ref_name == 'main'
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: repo,ref,workflow,commit
          custom_payload: |
            {
              attachments: [{
                color: '${{ job.status }}' === 'success' ? 'good' : '${{ job.status }}' === 'failure' ? 'danger' : 'warning',
                text: `Test name: ${{ matrix.test.name }}.\nStatus: ${{ job.status }}. Workflow: ${process.env.AS_WORKFLOW}. Repo: ${process.env.AS_REPO}. Ref: ${process.env.AS_REF}\nCommit: ${process.env.AS_COMMIT}`,
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.KOTS_BUILD_STATUS_SLACK_WEBHOOK_URL }}
          MATRIX_CONTEXT: ${{ toJson(matrix) }}

  existing-tests:
    name: existing-tests (${{ matrix.test.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test:
          - id: existing-airgapped-install-admin
            name: type=existing cluster, env=airgapped, phase=new install, rbac=cluster admin
            test_path: regression/@existing-airgapped-install-admin
            airgapped: "1"
            upgrade: "0"
          - id: existing-airgapped-install-minimum
            name: type=existing cluster, env=airgapped, phase=new install, rbac=minimal rbac
            test_path: regression/@existing-airgapped-install-minimal
            airgapped: "1"
            upgrade: "0"
          - id: existing-online-upgrade-admin
            name: type=existing cluster, env=online, phase=upgraded install, rbac=cluster admin
            test_path: regression/@existing-online-upgrade-admin
            airgapped: "0"
            upgrade: "1"
          - id: existing-online-upgrade-minimum
            name: type=existing cluster, env=online, phase=upgraded install, rbac=minimal rbac
            test_path: regression/@existing-online-upgrade-minimal
            airgapped: "0"
            upgrade: "1"
          - id: existing-online-install-admin
            name: type=existing cluster, env=online, phase=new install, rbac=cluster admin
            test_path: regression/@existing-online-install-admin
            airgapped: "0"
            upgrade: "0"
          - id: existing-online-install-minimum
            name: type=existing cluster, env=online, phase=new install, rbac=minimal rbac
            test_path: regression/@existing-online-install-minimal
            airgapped: "0"
            upgrade: "0"
          - id: existing-airgapped-upgrade-admin
            name: type=existing cluster, env=airgapped, phase=upgraded install, rbac=cluster admin
            test_path: regression/@existing-airgapped-upgrade-admin
            airgapped: "1"
            upgrade: "1"
          - id: existing-airgapped-upgrade-minimum
            name: type=existing cluster, env=airgapped, phase=upgraded install, rbac=minimal rbac
            test_path: regression/@existing-airgapped-upgrade-minimal
            airgapped: "1"
            upgrade: "1"
    env:
      REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_API_TOKEN }}
      VM_NAME: kots-${{ matrix.test.id }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download kots binary
        uses: actions/download-artifact@v8
        with:
          name: kots
          path: cmx-assets

      - name: Download kotsadm bundle
        uses: actions/download-artifact@v8
        with:
          name: kotsadm-bundle
          path: cmx-assets/kotsadm-bundle

      - name: Install Replicated CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo replicatedhq/replicated --pattern '*_linux_amd64.tar.gz' --output /tmp/replicated.tar.gz --clobber
          tar -xzf /tmp/replicated.tar.gz -C /tmp
          sudo mv /tmp/replicated /usr/local/bin/replicated

      - name: Prepare CMX assets
        run: |
          ssh-keygen -q -t ed25519 -C cmx@ci -f /tmp/cmx-key -N ''
          tar -czf /tmp/playwright.tar.gz -C e2e playwright
          tar -czf /tmp/kotsadm.tar.gz -C cmx-assets/kotsadm-bundle -- airgap.yaml images
          chmod +x cmx-assets/kots .github/scripts/cmx-existing-cluster-setup.sh

      - name: Create CMX VM
        id: vm
        run: |
          replicated vm create \
            --distribution ubuntu \
            --version 22.04 \
            --instance-type r1.large \
            --disk 100 \
            --network-policy open \
            --name "$VM_NAME" \
            --ssh-public-key /tmp/cmx-key.pub \
            --tag repo=replicatedhq-kots \
            --tag workflow-run=${{ github.run_id }} \
            --tag test=${{ matrix.test.id }} \
            --ttl 6h \
            --wait 10m \
            --output json > /tmp/vm.json

          vm_id="$(jq -r '.[0].id' /tmp/vm.json)"
          network_id="$(jq -r '.[0].network_id' /tmp/vm.json)"
          ssh_endpoint="$(replicated vm ssh-endpoint "$vm_id" --username cmx)"
          ssh_authority="${ssh_endpoint#ssh://}"
          ssh_host_port="${ssh_authority#*@}"
          {
            echo "id=$vm_id"
            echo "network_id=$network_id"
            echo "ssh_host=${ssh_host_port%:*}"
            echo "ssh_port=${ssh_host_port##*:}"
          } >> "$GITHUB_OUTPUT"

      - name: Copy test assets to CMX VM
        env:
          SSH_HOST: ${{ steps.vm.outputs.ssh_host }}
          SSH_PORT: ${{ steps.vm.outputs.ssh_port }}
        run: |
          ssh_args=(-i /tmp/cmx-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          scp_args=(-i /tmp/cmx-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SSH_PORT")
          ssh "${ssh_args[@]}" "cmx@$SSH_HOST" 'mkdir -p /home/cmx/playwright'
          scp "${scp_args[@]}" /tmp/playwright.tar.gz "cmx@$SSH_HOST:/tmp/playwright.tar.gz"
          scp "${scp_args[@]}" /tmp/kotsadm.tar.gz "cmx@$SSH_HOST:/tmp/kotsadm.tar.gz"
          scp "${scp_args[@]}" cmx-assets/kots "cmx@$SSH_HOST:/tmp/kots-nightly"
          scp "${scp_args[@]}" .github/scripts/cmx-existing-cluster-setup.sh "cmx@$SSH_HOST:/tmp/cmx-existing-cluster-setup.sh"
          ssh "${ssh_args[@]}" "cmx@$SSH_HOST" 'tar -xzf /tmp/playwright.tar.gz -C /home/cmx'

      - name: Install k0s and prepare test VM
        env:
          SSH_HOST: ${{ steps.vm.outputs.ssh_host }}
          SSH_PORT: ${{ steps.vm.outputs.ssh_port }}
          OLD_VERSION: ${{ github.event.inputs.version_tag_old || inputs.version_tag_old }}
        run: |
          ssh_args=(-i /tmp/cmx-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          # Variables in the remote command intentionally expand on the runner.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "cmx@$SSH_HOST" \
            "sudo env KOTS_OLD_VERSION='$OLD_VERSION' IS_UPGRADE='${{ matrix.test.upgrade }}' IS_AIRGAPPED='${{ matrix.test.airgapped }}' TEST_PATH='${{ matrix.test.test_path }}' bash /tmp/cmx-existing-cluster-setup.sh"

      - name: Expose Admin Console
        id: admin_console
        run: |
          for attempt in $(seq 1 5); do
            if replicated vm port expose '${{ steps.vm.outputs.id }}' --port 30880 --protocol http --output json > /tmp/admin-console-port.json; then
              break
            fi
            if [[ "$attempt" == "5" ]]; then
              echo "Failed to expose the Admin Console after $attempt attempts" >&2
              exit 1
            fi
            echo "Replicated API request failed; retrying Admin Console port exposure (attempt $attempt/5)"
            sleep $((attempt * 5))
          done
          hostname="$(jq -r .hostname /tmp/admin-console-port.json)"
          echo "url=http://$hostname" >> "$GITHUB_OUTPUT"

      - name: Air-gap CMX network
        if: matrix.test.airgapped == '1'
        env:
          SSH_HOST: ${{ steps.vm.outputs.ssh_host }}
          SSH_PORT: ${{ steps.vm.outputs.ssh_port }}
        run: |
          replicated network update '${{ steps.vm.outputs.network_id }}' --policy airgap
          for attempt in $(seq 1 12); do
            if ssh -i /tmp/cmx-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT" "cmx@$SSH_HOST" \
              'if curl -fsS --connect-timeout 5 --max-time 10 https://example.com >/dev/null; then exit 1; fi'; then
              echo "CMX air-gap policy is blocking egress"
              exit 0
            fi
            echo "Waiting for CMX air-gap policy to take effect (attempt $attempt/12)"
            sleep 5
          done
          echo "CMX air-gap policy still allows egress" >&2
          exit 1

      - name: Run the test
        env:
          SSH_HOST: ${{ steps.vm.outputs.ssh_host }}
          SSH_PORT: ${{ steps.vm.outputs.ssh_port }}
          OLD_VERSION: ${{ github.event.inputs.version_tag_old || inputs.version_tag_old }}
          NEW_VERSION: ${{ github.event.inputs.version_tag_new || inputs.version_tag_new }}
          TEST_REPLICATED_API_TOKEN: ${{ secrets.REPLICATED_QA_API_TOKEN }}
          TEST_AWS_ACCESS_KEY_ID: ${{ secrets.E2E_TESTIM_AWS_ACCESS_KEY_ID }}
          TEST_AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_TESTIM_AWS_SECRET_ACCESS_KEY }}
          TEST_OKTA_PASSWORD: ${{ secrets.IDENTITY_SERVICE_OKTA_PASSWORD }}
          TEST_OKTA_CLIENT_SECRET: ${{ secrets.IDENTITY_SERVICE_OKTA_CLIENT_SECRET }}
          TEST_OKTA_ACCESS_TOKEN: ${{ secrets.IDENTITY_SERVICE_OKTA_ACCESS_TOKEN }}
        run: |
          ssh_args=(-i /tmp/cmx-key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60 -o ServerAliveCountMax=10 -p "$SSH_PORT")
          # Variables in the remote command intentionally expand on the runner.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" "cmx@$SSH_HOST" \
            "sudo env TEST_DIR=regression TEST_PATH='${{ matrix.test.test_path }}' PLAYWRIGHT_BROWSERS_PATH=/home/cmx/playwright/.cache/ms-playwright OLD_KOTS_VERSION='$OLD_VERSION' NEW_KOTS_VERSION='$NEW_VERSION' REPLICATED_API_TOKEN='$TEST_REPLICATED_API_TOKEN' AWS_ACCESS_KEY_ID='$TEST_AWS_ACCESS_KEY_ID' AWS_SECRET_ACCESS_KEY='$TEST_AWS_SECRET_ACCESS_KEY' IDENTITY_SERVICE_OKTA_PASSWORD='$TEST_OKTA_PASSWORD' IDENTITY_SERVICE_OKTA_CLIENT_SECRET='$TEST_OKTA_CLIENT_SECRET' IDENTITY_SERVICE_OKTA_ACCESS_TOKEN='$TEST_OKTA_ACCESS_TOKEN' ADMIN_CONSOLE_PORT=30880 CMX_REGISTRY=true AIRGAP_ASSETS_PRELOADED='${{ matrix.test.airgapped == '1' && 'true' || 'false' }}' AIRGAP_ASSET_DIR=/opt/kots-regression-airgap KUBECONFIG=/root/.kube/config bash -c 'export PRIVATE_IP=\$(cat /tmp/cmx-private-ip); export BASE_URL=http://\$PRIVATE_IP:30880; cd /home/cmx/playwright && npx playwright test \"\$TEST_PATH\"'"

      - name: Collect failure artifacts
        if: failure() && steps.vm.outputs.id != ''
        continue-on-error: true
        env:
          SSH_HOST: ${{ steps.vm.outputs.ssh_host }}
          SSH_PORT: ${{ steps.vm.outputs.ssh_port }}
        run: |
          ssh_args=(-i /tmp/cmx-key -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -p "$SSH_PORT")
          scp_args=(-i /tmp/cmx-key -o ConnectTimeout=15 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -P "$SSH_PORT")
          timeout 2m ssh "${ssh_args[@]}" "cmx@$SSH_HOST" 'sudo timeout 45s support-bundle --interactive=false --output /tmp/host-support-bundle.tar.gz /tmp/support-bundle-host-spec.yaml || true; sudo timeout 45s support-bundle --interactive=false --output /tmp/in-cluster-support-bundle.tar.gz /tmp/support-bundle-in-cluster-spec.yaml || true; sudo chmod -R a+r /tmp/*support-bundle.tar.gz /home/cmx/playwright/playwright-report 2>/dev/null || true' || true
          scp "${scp_args[@]}" -r "cmx@$SSH_HOST:/home/cmx/playwright/playwright-report" ./playwright-report || true
          scp "${scp_args[@]}" "cmx@$SSH_HOST:/tmp/host-support-bundle.tar.gz" . || true
          scp "${scp_args[@]}" "cmx@$SSH_HOST:/tmp/in-cluster-support-bundle.tar.gz" . || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: existing-${{ matrix.test.id }}-failure-artifacts
          path: |
            playwright-report/
            host-support-bundle.tar.gz
            in-cluster-support-bundle.tar.gz
          if-no-files-found: warn

      - name: Print troubleshooting details
        if: failure() && steps.vm.outputs.id != ''
        run: |
          echo "Admin Console: ${{ steps.admin_console.outputs.url }}"
          echo "VM: ${{ steps.vm.outputs.id }}"
          echo "Failure artifacts were collected before the VM cleanup step."

      - name: Remove CMX VM
        if: always() && steps.vm.outputs.id != ''
        continue-on-error: true
        run: replicated vm rm '${{ steps.vm.outputs.id }}'

  cleanup:
    needs: [get-workspace-name, tests, existing-tests]
    runs-on: ubuntu-latest
    env:
      WORKSPACE: ${{ needs.get-workspace-name.outputs.name }}
    steps:
      - name: Trigger workspace cleanup
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.E2E_GH_PAT }}
          repository: replicatedhq/kots
          event-type: e2e-workspace-cleanup
          client-payload: '{"workspace": "${{ env.WORKSPACE }}"}'
