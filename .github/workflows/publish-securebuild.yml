name: publish-securebuild

on:
  workflow_call:
    inputs:
      version:
        description: 'Stable version tag to build (e.g. v1.2.3)'
        required: true
        type: string
    secrets:
      SECUREBUILD_API_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to build (e.g. v1.2.3)'
        required: true
        type: string

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    steps:
      - name: Require a stable release version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "SecureBuild only supports stable release versions (for example, v1.2.3): $VERSION"
            exit 1
          fi

  build-package:
    needs: validate-version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Set version
        id: version
        run: |
          echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Install securebuild CLI
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/securebuildhq/securebuild/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/securebuildhq/securebuild/releases/download/${LATEST_TAG}/securebuild-cli-linux-amd64" -o securebuild
          chmod +x securebuild

      - name: Build package
        run: |
          ./securebuild build package \
            --package-family-name kotsadm \
            --tag ${{ steps.version.outputs.version }} \
            --api-token "${{ secrets.SECUREBUILD_API_TOKEN }}"

  build-image:
    needs: build-package
    runs-on: ubuntu-22.04
    if: ${{ !cancelled() && needs.build-package.result == 'success' }}
    strategy:
      matrix:
        image-name:
          - kotsadm
          - kotsadm-migrations
          - kurl-proxy
    steps:
      - name: Install securebuild CLI
        run: |
          LATEST_TAG=$(curl -s https://api.github.com/repos/securebuildhq/securebuild/releases/latest | jq -r .tag_name)
          curl -sL "https://github.com/securebuildhq/securebuild/releases/download/${LATEST_TAG}/securebuild-cli-linux-amd64" -o securebuild
          chmod +x securebuild

      - name: Build image
        run: |
          ./securebuild build image \
            --image-name ${{ matrix.image-name }} \
            --tag ${{ needs.build-package.outputs.version }} \
            --api-token "${{ secrets.SECUREBUILD_API_TOKEN }}"
