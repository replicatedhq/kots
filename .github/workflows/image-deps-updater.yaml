name: Update image deps

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      overwrite:
        description: 'Overwrite the existing image tags'
        required: false
        default: 'true'
      legacy_kots_version:
        description: 'Legacy KOTS version to verify or publish'
        type: string
      legacy_archive_digest:
        description: 'Verified release archive SHA-256 (full archive for MinIO)'
        type: string
      legacy_companion:
        description: 'Previously tested companion listed in scripts/legacy-companion-releases.json'
        type: string
      legacy_overlay_receipt:
        description: 'Verified OCI image rebuild receipt in JSON'
        type: string
      legacy_publish:
        description: 'Move the Docker Hub release tag after verification'
        type: boolean
        default: false
jobs:
  publish-legacy-kotsadm:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (inputs.legacy_kots_version != '' || inputs.legacy_archive_digest != '' ||
       inputs.legacy_companion != '' || inputs.legacy_overlay_receipt != '' || inputs.legacy_publish)
    concurrency: >-
      ${{ inputs.legacy_companion != '' && format('kots-legacy-companion-{0}-{1}',
      inputs.legacy_kots_version, inputs.legacy_companion) || 'kots-legacy-baseline-backfill' }}
    permissions:
      contents: read
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22
      - id: legacy-syft
        uses: anchore/sbom-action/download-syft@a930d0ac434e3182448fe678398ba5713717112a
        with:
          syft-version: v1.57.2
      - name: Verify and publish the legacy image
        env:
          GH_TOKEN: ${{ github.token }}
          SYFT_BIN: ${{ steps.legacy-syft.outputs.cmd }}
          LEGACY_KOTS_VERSION: ${{ inputs.legacy_kots_version }}
          LEGACY_ARCHIVE_DIGEST: ${{ inputs.legacy_archive_digest }}
          LEGACY_COMPANION: ${{ inputs.legacy_companion }}
          LEGACY_OVERLAY_RECEIPT: ${{ inputs.legacy_overlay_receipt }}
          LEGACY_PUBLISH: ${{ inputs.legacy_publish }}
          DOCKERHUB_USER: ${{ inputs.legacy_publish && secrets.DOCKERHUB_USER || '' }}
          DOCKERHUB_PASSWORD: ${{ inputs.legacy_publish && secrets.DOCKERHUB_PASSWORD || '' }}
        run: bash scripts/publish-legacy-baseline-image.sh

  build-3rd-party-images:
    if: >-
      github.event_name != 'workflow_dispatch' ||
      (inputs.legacy_kots_version == '' && inputs.legacy_archive_digest == '' &&
       inputs.legacy_companion == '' && inputs.legacy_overlay_receipt == '' && !inputs.legacy_publish)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Get tags
      id: get-tags
      run: |
        set -euo pipefail

        # Get latest minio version from registry
        minio_version=$(skopeo list-tags --creds "${{ secrets.DOCKERHUB_USER }}:${{ secrets.DOCKERHUB_PASSWORD }}" docker://index.docker.io/kotsadm/minio | \
          jq -r '.Tags[]' | \
          grep -E '^RELEASE\.[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}-[0-9]{2}-[0-9]{2}Z$' | \
          sort -V | \
          tail -n 1)

        # Get latest rqlite version from registry
        rqlite_version=$(skopeo list-tags --creds "${{ secrets.DOCKERHUB_USER }}:${{ secrets.DOCKERHUB_PASSWORD }}" docker://index.docker.io/kotsadm/rqlite | \
          jq -r '.Tags[]' | \
          grep -E '[0-9]+\.[0-9]+\.[0-9]+$' | \
          sort -V | \
          tail -n 1)

        # Get latest dex version from registry
        dex_version=$(skopeo list-tags --creds "${{ secrets.DOCKERHUB_USER }}:${{ secrets.DOCKERHUB_PASSWORD }}" docker://index.docker.io/kotsadm/dex | \
          jq -r '.Tags[]' | \
          grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' | \
          sed 's/^v//' | \
          sort -V | \
          tail -n 1)

        {
          echo "minio-tag=$minio_version"
          echo "rqlite-tag=$rqlite_version"
          echo "dex-tag=$dex_version"
        } >> "$GITHUB_OUTPUT"



  update-image-deps:
    needs: [build-3rd-party-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Run Update Script
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          go run ./cmd/imagedeps

      - name: Create Pull Request # creates a PR if there are differences
        uses: peter-evans/create-pull-request@v8
        id: cpr
        with:
          token: ${{ secrets.GH_PAT }}
          commit-message: Update KOTS image dependency tags
          title: 'Automated KOTS Image Dependency Tag Update'
          branch: automation/image-dependencies
          delete-branch: true
          labels: |
            automated-pr
            images
            type::security
          draft: false
          base: "main"
          body: "Automated changes by the [image-deps-updater](https://github.com/replicatedhq/kots/blob/main/.github/workflows/image-deps-updater.yaml) GitHub action"

      - name: Check outputs
        if: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          echo "Pull Request Number - ${{ steps.cpr.outputs.pull-request-number }}"
          echo "Pull Request URL - ${{ steps.cpr.outputs.pull-request-url }}"

      - name: Slack Notification
        if: ${{ steps.cpr.outputs.pull-request-number }}
        uses: slackapi/slack-github-action@v4.0.0
        with:
          webhook: ${{ secrets.KOTS_IMAGE_DEPS_SLACK_WEBHOOK }}
          webhook-type: webhook-trigger
          payload: |
            pull_request_url: "${{steps.cpr.outputs.pull-request-url}}"
